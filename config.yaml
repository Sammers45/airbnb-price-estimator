# All settings in one place. Scripts read this file; nothing is hard-coded.
seed: 42

paths:
  raw: data/raw/airbnb.parquet # cached copy of the Hugging Face dataset
  processed: data/processed/listings.parquet
  reports: reports
  predictions: data/predictions
  models: models

data:
  # https://huggingface.co/datasets/MongoDB/airbnb_embeddings  (5,555 rows, Apache-2.0)
  # Note the underscore: "airbnb_embeddings", not "airbnb-embeddings".
  hf_dataset: MongoDB/airbnb_embeddings
  # Decided after the audit: no market has 1,000 rows (largest: Istanbul, 660),
  # so all markets are pooled and every price is converted to USD.
  market: all
  min_market_rows: 1000 # rule used to recommend a single market
  min_price: 1.0 # rows with missing or lower price are dropped

# Prices are in local currency. Each listing's country gives its currency;
# price_usd = local price / units_per_usd.
currency:
  by_country:
    United States: USD
    Canada: CAD
    Spain: EUR
    Portugal: EUR
    Australia: AUD
    Brazil: BRL
    Turkey: TRY
    Hong Kong: HKD
    China: HKD # the 19 "China" rows are all in the Hong Kong market
  # 2019 annual averages, local currency units per 1 USD.
  # Federal Reserve G.5A (2020-01-02): CAD 1.3269, BRL 3.9440, HKD 7.8351,
  #   EUR = 1 / 1.1194 USD per EUR, AUD = 1 / 0.6952 USD per AUD.
  # Turkey (not in G.5A): FRED series CCUSMA02TRA618N, 2019 = 5.6765.
  units_per_usd:
    USD: 1.0
    CAD: 1.3269
    EUR: 0.8933
    AUD: 1.4384
    BRL: 3.9440
    TRY: 5.6765
    HKD: 7.8351

checks:
  url_sample: 50
  url_timeout_s: 8
  url_fail_threshold: 0.20 # above this, use the provided image_embeddings
  text_emb_dim: 1536
  image_emb_dim: 512

features:
  top_k_amenities: 30
  text_fields: [name, summary, description]
  leakage_columns: # tied to the price or identifiers -> removed
    - weekly_price
    - monthly_price
    - cleaning_fee
    - security_deposit
    - extra_people
    - availability
    - reviews
    - listing_url
    - calendar_last_scraped

cv:
  n_folds: 5
  n_price_bins: 10 # stratify folds on price deciles

outliers: # applied inside each training fold (Phase 3+)
  lower_quantile: 0.01
  upper_quantile: 0.99

eda:
  suspect_z: 3.5 # robust z-score of log price within market; above = review by hand
  probe_alphas: [0.01, 0.1, 1, 10, 100, 1000] # ridge strengths tried inside each fold
  top_n: 20 # rows shown in the suspicious-price table

baseline:
  params: # LightGBM, predicting log1p(price)
    objective: regression # squared error on the log scale
    learning_rate: 0.03
    num_leaves: 31
    min_data_in_leaf: 20
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 1
    lambda_l2: 1.0
    cat_smooth: 10
  num_boost_round: 5000
  early_stopping_rounds: 200
  inner_valid_frac: 0.1 # slice of each TRAINING fold used for early stopping

mlflow:
  enabled: true
  tracking_uri: sqlite:///mlflow.db # local database file; open with `mlflow ui`
  experiment: airbnb-price

text_model:
  model_name: distilbert-base-multilingual-cased
  max_length: 256
  batch_size: 32
  epochs: 3
  learning_rate: 3.0e-5
  weight_decay: 0.01
  warmup_frac: 0.1
  dropout: 0.1
  inner_valid_frac: 0.1
  train_final: true

image_model:
  clip_model: openai/clip-vit-base-patch32
  verify_photos: 40
  verify_min_cosine: 0.95
  probe_alphas: [0.1, 1, 10, 100, 1000]
  prompts:
    luxury: a photo of a luxurious, high-end home interior
    modern: a photo of a modern, stylish apartment
    view: a photo of a room with a sea or ocean view
    pool: a photo of a swimming pool
    garden: a photo of a garden or terrace
    exterior: a photo of the outside of a house
    bright: a photo of a bright, sunny room
    cramped: a photo of a small, cramped room
    basic: a photo of a plain, basic bedroom
    dated: a photo of an old, dated interior
    kitchen: a photo of a kitchen
    bathroom: a photo of a bathroom

fusion:
  hidden: 64
  heads: 4
  dropout: 0.2
  modality_dropout: 0.1
  residual_on_baseline: true
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  batch_size: 128
  max_epochs: 200
  patience: 15
  inner_valid_frac: 0.1
  seeds: 3
  train_final: true

evaluate: # Phase 7: runs on a normal CPU
  pca_components: 8 # principal components of the text / photo vectors (fit per training fold)
  bootstrap: 2000 # paired bootstrap resamples
  alpha: 0.05 # significance level after Holm correction
